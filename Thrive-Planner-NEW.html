<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#fff7f4">
<title>My Thrive Planner — Kirsten the Naturopath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#fff8f4;--surface:#fffdfb;--surface2:#fff0f4;--ink:#35252a;--muted:#7a626b;--line:#ecd9df;
  --pink:#d72b6b;--pink2:#f3a6bf;--pink3:#fde4ed;--orange:#f28a3a;--yellow:#f5cf4d;--green:#6e9c83;
  --shadow:0 12px 36px rgba(94,42,59,.10);--radius:22px;--radius-sm:15px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#fff8f4 0%,#fffdfb 48%,#fff8f4 100%);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;min-height:100vh;padding-bottom:92px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.app{max-width:980px;margin:auto;padding:20px 18px 40px}
.brand{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.logo{width:74px;height:74px;border-radius:20px;object-fit:cover;background:white;box-shadow:var(--shadow)}
.brand-copy h1{font-family:"Libre Baskerville",serif;font-size:clamp(1.45rem,4vw,2.2rem);margin:0}
.brand-copy p{margin:.25rem 0 0;color:var(--muted)}
.build{display:inline-flex;margin-top:.45rem;padding:.25rem .65rem;border-radius:999px;background:var(--pink3);color:var(--pink);font-size:.74rem;font-weight:700}
.hero{background:linear-gradient(135deg,#fff 0%,#fff0f4 60%,#fff5df 100%);border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:var(--shadow);margin-bottom:18px}
.hero h2{font-family:"Libre Baskerville",serif;margin:0 0 8px;font-size:clamp(1.5rem,4vw,2.3rem)}
.hero p{margin:0;color:var(--muted);max-width:700px}
.grid{display:grid;gap:14px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:720px){.grid.two,.grid.three{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 5px 20px rgba(94,42,59,.05)}
.card.tint{background:var(--surface2)}
.card.sun{background:#fff7df;border-color:#f3df9a}
.card h3,.card h2{margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.kpi{font-family:"Libre Baskerville",serif;font-size:2rem}
.section-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:24px 0 10px}
.section-title h2{font-family:"Libre Baskerville",serif;margin:0;font-size:1.35rem}
.btn{border:0;border-radius:999px;padding:.78rem 1.15rem;background:var(--pink);color:white;font-weight:700;box-shadow:0 5px 14px rgba(215,43,107,.18)}
.btn.secondary{background:white;color:var(--pink);border:1px solid var(--pink)}
.btn.orange{background:var(--orange)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.small{padding:.55rem .85rem;font-size:.86rem}
.btn.block{width:100%}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.field{display:block;margin-top:12px}
.field span{display:block;font-size:.84rem;font-weight:700;margin-bottom:5px;color:var(--muted)}
.input,.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:white;border-radius:13px;padding:.75rem .85rem;min-height:44px;outline:none}
.field textarea{min-height:90px;resize:vertical}
.input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(215,43,107,.10)}
.range-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.range-row input[type=range]{width:100%;accent-color:var(--pink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:white;border-radius:999px;padding:.5rem .8rem;font-weight:600}
.chip.active{border-color:var(--pink);background:var(--pink3);color:var(--pink)}
.list{display:grid;gap:10px}
.list-row{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);border-radius:15px;padding:13px 14px;background:white}
.list-row button{border:0;background:none;font-weight:700;color:var(--pink)}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.menu-card{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:17px;text-align:left;min-height:118px}
.menu-card b{display:block;font-size:1.02rem;margin-bottom:4px}
.menu-card span{color:var(--muted);font-size:.88rem}
.menu-card .icon{font-size:1.45rem;margin-bottom:8px}
@media(max-width:620px){.menu{grid-template-columns:1fr}}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px}
.tab-pill{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:999px;padding:.65rem .9rem;font-weight:700}
.tab-pill.active{background:var(--pink);color:white;border-color:var(--pink)}
.bottom-nav{position:fixed;z-index:50;left:0;right:0;bottom:0;background:rgba(255,253,251,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0))}
.bottom-nav nav{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nav-btn{border:0;background:transparent;border-radius:15px;padding:8px 3px;color:var(--muted);font-size:.76rem;font-weight:700}
.nav-btn .ni{font-size:1.25rem;display:block;margin-bottom:2px}
.nav-btn.active{background:var(--pink3);color:var(--pink)}
.nav-btn.mid{background:var(--pink2);color:#522033}
.nav-btn.mid.active{background:var(--pink);color:#fff}
.meal-grid{display:grid;gap:12px}
.meal-day{background:white;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.meal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;background:linear-gradient(90deg,var(--pink3),#fff7df)}
.meal-body{padding:14px}
.meal-row{display:grid;grid-template-columns:95px 1fr;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.meal-row:last-child{border:0}
.meal-row b{color:var(--pink);font-size:.84rem}
.meal-note{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
@media(max-width:560px){.meal-note{grid-template-columns:1fr}.meal-row{grid-template-columns:80px 1fr}}
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:8px;overflow:auto;padding-bottom:6px}
.day-plan{min-width:140px;border:1px solid var(--line);border-radius:16px;padding:12px;background:white}
.day-plan strong{display:block;margin-bottom:6px}
.check-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:680px){.check-grid{grid-template-columns:1fr 1fr}}
@media(max-width:460px){.check-grid{grid-template-columns:1fr}}
.scale-card{border:1px solid var(--line);border-radius:15px;padding:12px;background:white}
.scale-card label{display:flex;justify-content:space-between;font-weight:700;font-size:.9rem}
.scale-card output{color:var(--pink)}
.symptom-grid,.habit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(max-width:650px){.symptom-grid,.habit-grid{grid-template-columns:1fr}}
.symptom{border:1px solid var(--line);border-radius:14px;padding:10px;background:white}
.symptom .top{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;font-weight:700}
.symptom input{width:100%;accent-color:var(--orange)}
.habit{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:11px;background:white}
.habit input{width:20px;height:20px;accent-color:var(--pink)}
.progressbar{height:10px;background:#f1e5e9;border-radius:999px;overflow:hidden}
.progressbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--orange));border-radius:999px}
.spark{display:flex;align-items:end;gap:5px;height:90px;margin-top:10px}
.spark i{flex:1;min-width:8px;background:linear-gradient(180deg,var(--pink2),var(--pink));border-radius:6px 6px 2px 2px;position:relative}
.spark i span{position:absolute;bottom:-21px;left:50%;transform:translateX(-50%);font-size:.65rem;color:var(--muted)}
.module{border:1px solid var(--line);border-radius:18px;background:white;overflow:hidden}
.module-head{padding:14px 15px;background:var(--pink3);display:flex;justify-content:space-between;gap:10px;align-items:center}
.lesson{padding:13px 15px;border-top:1px solid var(--line)}
.lesson:first-of-type{border-top:0}
.lesson-grid{display:grid;grid-template-columns:1fr 150px;gap:12px;align-items:start}
@media(max-width:620px){.lesson-grid{grid-template-columns:1fr}}
.badge{display:inline-flex;padding:.2rem .55rem;border-radius:999px;background:#f1ecee;color:var(--muted);font-size:.75rem;font-weight:700}
.badge.done{background:#e4f2e9;color:#397153}
.badge.progress{background:#fff1da;color:#9a5a13}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:white}
table{border-collapse:collapse;width:100%;min-width:700px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:.88rem;vertical-align:top}
th{background:var(--pink3);color:#61243d}
.toast{position:fixed;z-index:80;left:50%;bottom:100px;transform:translateX(-50%);background:#35252a;color:white;border-radius:999px;padding:.7rem 1rem;font-weight:700;box-shadow:var(--shadow)}
.modal-bg{position:fixed;z-index:70;inset:0;background:rgba(40,20,28,.52);display:grid;place-items:end center}
.modal{width:100%;max-width:760px;max-height:90vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:20px}
.modal-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.close{border:0;background:white;border-radius:50%;width:42px;height:42px;font-size:1.2rem}
.empty{padding:22px;border:1px dashed var(--line);border-radius:18px;text-align:center;color:var(--muted)}
.note{border-left:4px solid var(--orange);background:#fff7e8;border-radius:12px;padding:12px 14px;color:#60411f}
.hide{display:none!important}
</style>
</head>

<div id="app"></div>
<div id="modal"></div>
<div id="toast" class="toast hide"></div>

 document.querySelectorAll("[data-week-change]").forEach(b=>b.onclick=()=>{selectedWeek=Math.max(1,(selectedWeek||currentWeek())+(+b.dataset.weekChange));render()});
 document.querySelectorAll("[data-week-today]").forEach(b=>b.onclick=()=>{selectedWeek=currentWeek();render()});
 document.querySelectorAll("[data-ref-week]").forEach(b=>b.onclick=()=>{selectedWeek=Math.max(1,(selectedWeek||currentWeek())+(+b.dataset.refWeek));render()});
 document.querySelectorAll("[data-week-priority]").forEach(x=>x.oninput=()=>{const p=getWeekPlan(+x.dataset.week);p.priorities[+x.dataset.weekPriority]=x.value;save()});
 document.querySelectorAll("[data-week-day]").forEach(x=>x.oninput=x.onchange=()=>{const p=getWeekPlan(+x.dataset.week);p.days[x.dataset.weekDay]=p.days[x.dataset.weekDay]||{};p.days[x.dataset.weekDay][x.dataset.f]=x.type==="checkbox"?x.checked:x.value;save()});
 document.querySelectorAll("[data-meal-day]").forEach(x=>x.oninput=x.onchange=()=>{const d=x.dataset.mealDay;S.mealNotes[d]=S.mealNotes[d]||{};S.mealNotes[d][x.dataset.mealF]=x.type==="checkbox"?x.checked:x.value;save()});
 document.querySelectorAll("[data-check]").forEach(x=>x.oninput=()=>{const d=dateKey();S.checkins[d]=S.checkins[d]||{};S.checkins[d][x.dataset.check]=x.type==="number"?(x.value===""?"":+x.value):x.value;save()});
 document.querySelectorAll("[data-check-range]").forEach(x=>x.oninput=()=>{const d=dateKey();S.checkins[d]=S.checkins[d]||{};S.checkins[d][x.dataset.checkRange]=+x.value;x.previousElementSibling.querySelector("output").textContent=x.value;save()});
 document.querySelectorAll("[data-check-box]").forEach(x=>x.onchange=()=>{const d=dateKey();S.checkins[d]=S.checkins[d]||{};S.checkins[d][x.dataset.checkBox]=x.checked;save()});
 document.querySelectorAll("[data-sym]").forEach(x=>x.oninput=()=>{const d=dateKey();S.symptoms[d]=S.symptoms[d]||{};S.symptoms[d][x.dataset.sym]=+x.value;x.previousElementSibling.querySelector("b").textContent=x.value;save()});
 document.querySelectorAll("[data-habit]").forEach(x=>x.onchange=()=>{const d=dateKey();S.habits[d]=S.habits[d]||{};S.habits[d][x.dataset.habit]=x.checked;save();render()});
 document.querySelectorAll("[data-goal]").forEach(x=>x.oninput=x.onchange=()=>{const i=+x.dataset.goal;S.journey.goals[i]=S.journey.goals[i]||{};S.journey.goals[i][x.dataset.gf]=x.value;save()});
 document.querySelectorAll("[data-rating]").forEach(x=>x.oninput=x.onchange=()=>{const a=x.dataset.rating;S.journey.ratings[a]=S.journey.ratings[a]||{};S.journey.ratings[a][x.dataset.rf]=x.type==="checkbox"?x.checked:(x.value===""?"":+x.value);save()});
 document.querySelectorAll("[data-intention]").forEach(x=>x.oninput=()=>{S.journey.intentions[x.dataset.intention]=x.value;save()});
 document.querySelectorAll("[data-ref]").forEach(x=>x.oninput=x.onchange=()=>{const w=x.dataset.week;S.reflections[w]=S.reflections[w]||{};S.reflections[w][x.dataset.ref]=x.dataset.ref==="overall"?(x.value===""?"":+x.value):x.value;save()});
 document.querySelectorAll("[data-course]").forEach(x=>x.oninput=x.onchange=()=>{const id=x.dataset.course;S.course[id]=S.course[id]||{};S.course[id][x.dataset.cf]=x.value;if(x.dataset.cf==="status"&&x.value==="Complete"&&!S.course[id].completed)S.course[id].completed=dateKey();save();});
 document.querySelectorAll("[data-setting]").forEach(x=>x.oninput=x.onchange=()=>{S.settings[x.dataset.setting]=x.value;save()});
 document.querySelectorAll("[data-target]").forEach(x=>x.oninput=()=>{S.settings.targets[x.dataset.target]=+x.value;save()});
 const sf=document.getElementById("shopForm");if(sf)sf.onsubmit=e=>{e.preventDefault();const fd=new FormData(sf);S.shopping.push({text:String(fd.get("item")),done:false});save();render()};
 document.querySelectorAll("[data-shop]").forEach(x=>x.onchange=()=>{S.shopping[+x.dataset.shop].done=x.checked;save();render()});
 document.querySelectorAll("[data-shop-del]").forEach(x=>x.onclick=()=>{S.shopping.splice(+x.dataset.shopDel,1);save();render()});
 const su=document.getElementById("suppForm");if(su)su.onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(su));S.supplements.push(o);save();render()};
 document.querySelectorAll("[data-supp-del]").forEach(x=>x.onclick=()=>{S.supplements.splice(+x.dataset.suppDel,1);save();render()});
 const af=document.getElementById("apptForm");if(af)af.onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(af));S.appointments.push(o);save();render()};
 document.querySelectorAll("[data-appt-del]").forEach(x=>x.onclick=()=>{S.appointments.splice(+x.dataset.apptDel,1);save();render()});
 document.querySelectorAll("[data-export-json]").forEach(x=>x.onclick=exportJSON);
 document.querySelectorAll("[data-export-xlsx]").forEach(x=>x.onclick=exportExcel);
 const ji=document.getElementById("jsonIn");if(ji)ji.onchange=async()=>{const f=ji.files?.[0];if(!f)return;try{const n=JSON.parse(await f.text());S=Object.assign(defaultState(),n);save();toast("Backup restored");render()}catch(e){toast("Could not read that backup")}};
}
render();
})();
</script>
</body>
</html>
