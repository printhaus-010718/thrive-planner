.small{font-size:.86rem}
.center{text-align:center}
.kpi{font-family:"Libre Baskerville",serif;font-size:2rem;line-height:1.3}

.section-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:24px 0 10px;flex-wrap:wrap}

.btn.orange{background:var(--orange)}

.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.file-label{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.file-label input{position:absolute;inset:0;opacity:0;cursor:pointer}
</style>

function normalize(raw){
 raw=raw&&typeof raw==="object"?raw:{};
 const d=defaultState(),s=Object.assign(d,raw);
 s.settings=Object.assign(defaultState().settings,raw.settings||{});
 s.settings.targets=Object.assign(defaultState().settings.targets,(raw.settings||{}).targets||{});

 if(!Array.isArray(s.journey.goals))s.journey.goals=[];

function ringPct(e,k){const v=+e[k]||0,t=+ringTarget(k)||1;return v/t}
function ringsSVG(e,size){const R0=[62,46,30],C=k=>2*Math.PI*k;return `<svg class="rings" viewBox="0 0 150 150" ${size?`style="width:${size}px;height:${size}px;flex-basis:${size}px"`:""} role="img" aria-label="Activity rings">${RINGS.map(([k,,c],i)=>{const r=R0[i],L=C(r),p=Math.min(1,ringPct(e,k));return `<circle class="bg" cx="75" cy="75" r="${r}" stroke="${c}" stroke-width="13"/><circle class="fg" data-ring="${k}" cx="75" cy="75" r="${r}" stroke="${c}" stroke-width="13" stroke-dasharray="${L}" stroke-dashoffset="${L*(1-p)}" transform="rotate(-90 75 75)"/>`}).join("")}</svg>`}
function ringVal(e,k){const v=+e[k]||0,u=RINGS.find(x=>x[0]===k)[3];return `${v.toLocaleString("en-AU")} / ${(+ringTarget(k)).toLocaleString("en-AU")}${u}`}
function activityCard(d){const e=S.checkins[d]||{};return `<div class="card" id="activityCard"><div class="actions" style="justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">Activity rings</h3><span class="small muted">Type in from your phone or watch</span></div><div class="rings-wrap">${ringsSVG(e)}<div class="ring-legend">${RINGS.map(([k,l,c])=>`<div class="ring-row"><span class="ring-dot" style="background:${c}"></span><div><label for="act-${k}">${l}</label><span class="val" data-ring-val="${k}">${ringVal(e,k)}</span></div><input id="act-${k}" type="number" inputmode="numeric" min="0" step="1" data-act="${k}" value="${e[k]??""}" placeholder="0"></div>`).join("")}</div></div></div>`}
function updateRings(d){const e=S.checkins[d]||{};document.querySelectorAll("circle[data-ring]").forEach(c=>{const k=c.dataset.ring,L=+c.getAttribute("stroke-dasharray");c.setAttribute("stroke-dashoffset",L*(1-Math.min(1,ringPct(e,k))))});document.querySelectorAll("[data-ring-val]").forEach(s=>s.textContent=ringVal(e,s.dataset.ringVal))}
function hasAnyData(){return Object.keys(S.checkins).length+Object.keys(S.symptoms).length+Object.keys(S.habits).length>0}

/* ---------- Routing ---------- */
const TABS=["today","progress","checkin","plan","more"];
function parseHash(){const [t,s]=(decodeURIComponent(location.hash.slice(1))||"today").split("/");return {tab:TABS.includes(t)?t:"today",sub:s||""}}
let route=parseHash();
let mealWeek=Math.ceil(currentMealDay()/7),selectedWeek=null,refWeek=null;
function go(tab,sub=""){route={tab,sub};const h="#"+tab+(sub?"/"+sub:"");if(location.hash!==h)history.pushState(null,"",h);render();scrollTo(0,0)}
addEventListener("popstate",()=>{route=parseHash();render();scrollTo(0,0)});
function refresh(){const y=scrollY;render();scrollTo(0,y)}

/* ---------- UI bits ---------- */
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.remove("hide");clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.add("hide"),2600)}
function header(title,sub){return `<header class="brand"><img class="logo" src="logo.png" alt="Kirsten the Naturopath"><div class="brand-copy"><h1>${esc(title)}</h1><p>${esc(sub||"Thrive Through Menopause with Kirsten the Naturopath")}</p></div></header>`}
function fixLogos(){document.querySelectorAll("img.logo").forEach(img=>{const swap=()=>{const d=document.createElement("div");d.className="logo logo-fallback";d.setAttribute("aria-hidden","true");d.textContent="♥";img.replaceWith(d)};if(img.complete&&!img.naturalWidth)swap();else img.onerror=swap})}
function bottomNav(){const tabs=[["today","☀️","Today"],["progress","📈","Progress"],["checkin","＋","Check-in"],["plan","🗓️","Plan"],["more","•••","More"]];
 return `<div class="bottom-nav"><nav aria-label="Main">${tabs.map(([k,i,l])=>`<button class="nav-btn ${k==="checkin"?"mid":""} ${route.tab===k?"active":""}" data-nav="${k}" ${route.tab===k?'aria-current="page"':""}><span class="ni" aria-hidden="true">${i}</span>${l}</button>`).join("")}</nav></div>`}
function pills(items,active,tab){return `<div class="tabs" role="tablist">${items.map(([k,l])=>`<button class="tab-pill ${active===k?"active":""}" role="tab" aria-selected="${active===k}" data-go="${tab}" data-sub="${k}">${l}</button>`).join("")}</div>`}
function backMore(){return `<button class="btn small ghost" data-go="more" data-sub="">← My Thrive Planner</button>`}

function render(){
 const app=document.getElementById("app");
 if(!S.settings.onboarded){app.innerHTML=viewWelcome();bind();fixLogos();return}
 let body;
 if(route.tab==="today")body=viewToday();
 else if(route.tab==="plan")body=viewPlan();
 else if(route.tab==="checkin")body=viewCheckin();
 else if(route.tab==="progress")body=viewProgress();
 else body=viewMore();
 app.innerHTML=`<main class="app">${body}</main>${bottomNav()}`;
 bind();fixLogos();
}

/* ---------- Plan ---------- */

/* ---------- Progress ---------- */

 add("10-Week Meal Plan",[["Day","Week","Week theme","Menu day","Breakfast","Lunch","Dinner","Snack","Followed/adapted?","My Swap / Notes","How I Felt"],...MEALS.map(m=>{const n=S.mealNotes10[m.day]||{};return[m.day,m.week,MEAL_WEEKS[m.week-1].title,m.dow,m.breakfast,m.lunch,m.dinner,m.snack,yn(n.followed),n.swap||"",n.felt||""]})],[5,6,30,8,40,36,46,28,12,24,20]);
 add("Supplements",[["Name","Dose","When","What it is for","Recommended by","Review date"],...S.supplements.map(x=>[x.name||"",x.dose||"",x.when||"",x.purpose||"",x.by||"",x.review||""])],[22,14,18,26,18,12]);
 add("Appointments",[["Date","Who with","About","Questions to ask","What we agreed"],...S.appointments.map(x=>[x.date||"",x.with||"",x.purpose||"",x.questions||"",x.outcome||""])],[12,18,24,40,40]);
 add("Shopping",[["Item","Got it?"],...S.shopping.map(x=>[x.text,yn(x.done)])],[34,8]);
 XLSX.writeFile(wb,`Thrive-Planner-${S.settings.name?S.settings.name.replace(/[^A-Za-z0-9_-]+/g,"-"):"Records"}-${dateKey()}.xlsx`);
 toast("Excel workbook downloaded");
}

/* ---------- Events ---------- */
const $$=s=>document.querySelectorAll(s);
function on(sel,ev,fn){$$(sel).forEach(el=>el.addEventListener(ev,e=>fn(el,e)))}
function entry(store,d){S[store][d]=S[store][d]||{};return S[store][d]}
function bind(){
 const wf=document.getElementById("welcomeForm");
 if(wf)wf.onsubmit=e=>{e.preventDefault();const fd=new FormData(wf);S.settings.name=String(fd.get("name")||"").trim();const st=String(fd.get("start")||"");if(isDate(st))S.settings.start=st;S.settings.programme=String(fd.get("programme")||PROGRAMMES[0]);S.settings.onboarded=true;mealWeek=Math.ceil(currentMealDay()/7);save();go("today");toast("You're all set!")};
 on("[data-nav]","click",b=>{const t=b.dataset.nav;go(t,t==="checkin"?"daily":"")});
 on("[data-go]","click",b=>go(b.dataset.go,b.dataset.sub||""));
 on("[data-meal-week]","click",b=>{mealWeek=+b.dataset.mealWeek;refresh()});
 on("[data-week-change]","click",b=>{selectedWeek=Math.max(1,(selectedWeek||currentWeek())+(+b.dataset.weekChange));refresh()});
 on("[data-week-today]","click",()=>{selectedWeek=null;refresh()});
 on("[data-ref-week]","click",b=>{refWeek=Math.max(1,(refWeek||currentWeek())+(+b.dataset.refWeek));refresh()});
 on("[data-ref-today]","click",()=>{refWeek=null;refresh()});
 on("[data-week-priority]","input",x=>{getWeekPlan(+x.dataset.week).priorities[+x.dataset.weekPriority]=x.value;save()});
 const wd=x=>{const p=getWeekPlan(+x.dataset.week);p.days[x.dataset.weekDay]=p.days[x.dataset.weekDay]||{};p.days[x.dataset.weekDay][x.dataset.f]=x.type==="checkbox"?x.checked:x.value;save()};
 on("[data-week-day]","input",wd);on("input[type=checkbox][data-week-day]","change",wd);
 const md=x=>{const n=entry("mealNotes10",x.dataset.mealDay);n[x.dataset.mealF]=x.type==="checkbox"?x.checked:x.value;save()};
 on("[data-meal-day]","input",md);on("input[type=checkbox][data-meal-day]","change",md);
 on("[data-check]","input",x=>{const e=entry("checkins",dateKey());if(x.type==="number"){e[x.dataset.check]=x.value===""?"":clamp(+x.value,0,16)}else e[x.dataset.check]=x.value;save()});
 on("[data-act]","input",x=>{const d=dateKey(),e=entry("checkins",d);if(x.value===""){delete e[x.dataset.act]}else e[x.dataset.act]=Math.max(0,Math.round(+x.value)||0);save();updateRings(d)});
 on("[data-check-box]","change",x=>{entry("checkins",dateKey())[x.dataset.checkBox]=x.checked;save()});
 on("[data-pick]","click",b=>{const e=entry("checkins",dateKey()),k=b.dataset.pick,v=+b.dataset.v;if(e[k]===v){delete e[k]}else e[k]=v;save();b.parentElement.querySelectorAll(".pk").forEach(p=>{const onp=e[k]===+p.dataset.v;p.classList.toggle("on",onp);p.setAttribute("aria-pressed",onp)})});
 on("[data-sym]","click",b=>{const e=entry("symptoms",dateKey()),k=b.dataset.sym,v=+b.dataset.v;e[k]=v;save();b.parentElement.querySelectorAll(".pk").forEach(p=>{const onp=+p.dataset.v===v;p.classList.toggle("on",onp);p.setAttribute("aria-pressed",onp)})});
 on("[data-habit]","change",x=>{const d=dateKey();entry("habits",d)[x.dataset.habit]=x.checked;save();const n=habitsDoneOn(d),c=document.getElementById("habitCount"),bar=document.getElementById("habitBar");if(c)c.textContent=n+"/10";if(bar)bar.style.width=n*10+"%"});
 const gl=x=>{const i=+x.dataset.goal;S.journey.goals[i]=S.journey.goals[i]||{};S.journey.goals[i][x.dataset.gf]=x.value;save()};
 on("input[data-goal]","input",gl);on("select[data-goal]","change",gl);
 const rt=x=>{const a=x.dataset.rating;S.journey.ratings[a]=S.journey.ratings[a]||{};S.journey.ratings[a][x.dataset.rf]=x.type==="checkbox"?x.checked:(x.value===""?"":clamp(+x.value,1,5));save()};
 on("[data-rating]","change",rt);
 on("[data-intention]","input",x=>{S.journey.intentions[x.dataset.intention]=x.value;save()});
 const rf=x=>{const r=entry("reflections",x.dataset.week);r[x.dataset.ref]=x.dataset.ref==="overall"?(x.value===""?"":+x.value):x.value;save()};
 on("textarea[data-ref]","input",rf);on("select[data-ref]","change",rf);
 on("input[data-course]","input",x=>{entry("course",x.dataset.course)[x.dataset.cf]=x.value;save()});
 on("select[data-course]","change",x=>{const c=entry("course",x.dataset.course);c.status=x.value;if(x.value==="Complete"&&!c.completed)c.completed=dateKey();if(x.value!=="Complete")c.completed="";save();refresh()});
 on("input[data-setting]","input",x=>{if(x.dataset.setting==="start"){if(!isDate(x.value))return;mealWeek=null}S.settings[x.dataset.setting]=x.value;if(mealWeek===null)mealWeek=Math.ceil(currentMealDay()/7);save()});
 on("select[data-setting]","change",x=>{S.settings[x.dataset.setting]=x.value;save()});
 on("[data-target]","input",x=>{if(x.value==="")return;S.settings.targets[x.dataset.target]=Math.max(0,+x.value);save()});
 const sf=document.getElementById("shopForm");if(sf)sf.onsubmit=e=>{e.preventDefault();const v=String(new FormData(sf).get("item")||"").trim();if(!v)return;S.shopping.push({text:v,done:false});save();refresh();const inp=document.querySelector("#shopForm input");if(inp)inp.focus()};
 on("[data-shop]","change",x=>{S.shopping[+x.dataset.shop].done=x.checked;save();refresh()});
 on("[data-shop-del]","click",(x,e)=>{e.preventDefault();S.shopping.splice(+x.dataset.shopDel,1);save();refresh()});
 on("[data-shop-add-week]","click",()=>{const items=["Chicken (700–900g)","Fish (300–400g)","Lean beef or turkey mince (300–400g)","Eggs (6)","Tinned sardines or salmon (2)","High-protein Greek yoghurt (1kg)","Milk or calcium-fortified soy milk","Cottage cheese or reduced-fat cheese","Spinach","Broccoli","Cabbage","Carrots","Capsicum","Sweet potato","Cucumber","Frozen mixed vegetables","Bananas","Apples","Seasonal fruit","Frozen berries","Rolled oats","Wholegrain bread","Brown rice","Wholemeal pasta or wraps","Tinned chickpeas, lentils or beans","Ground flaxseed","Walnuts or almonds","Peanut butter","Tinned tomatoes","Low-salt stock","Lemon"];const have=new Set(S.shopping.map(x=>x.text.toLowerCase()));let n=0;items.forEach(t=>{if(!have.has(t.toLowerCase())){S.shopping.push({text:t,done:false});n++}});save();toast(n?`Added ${n} items to Shopping`:"Already on your Shopping list")});
 on("[data-shop-clear]","click",()=>{S.shopping=S.shopping.filter(x=>!x.done);save();refresh()});
 const su=document.getElementById("suppForm");if(su)su.onsubmit=e=>{e.preventDefault();S.supplements.push(Object.fromEntries(new FormData(su)));save();refresh();toast("Supplement added")};
 on("[data-supp-del]","click",x=>{const s=S.supplements[+x.dataset.suppDel];if(confirm(`Remove ${s?.name||"this supplement"}?`)){S.supplements.splice(+x.dataset.suppDel,1);save();refresh()}});
 const af=document.getElementById("apptForm");if(af)af.onsubmit=e=>{e.preventDefault();S.appointments.push(Object.fromEntries(new FormData(af)));save();refresh();toast("Appointment added")};
 on("[data-appt-del]","click",x=>{if(confirm("Remove this appointment?")){S.appointments.splice(+x.dataset.apptDel,1);save();refresh()}});
 on("[data-backup]","click",exportJSON);
 on("[data-export-xlsx]","click",exportExcel);
 on("#jsonIn","change",x=>{importJSON(x.files&&x.files[0]);x.value=""});
 on("[data-reset]","click",()=>{if(!confirm("Erase ALL planner data on this device? This can't be undone."))return;if(!confirm("Are you sure? Tap OK to erase everything."))return;try{localStorage.removeItem(KEY)}catch(e){}S=normalize({});S.settings.onboarded=false;save();go("today")});
}

render();
})();
</script>
</body>
</html>
