<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFF8F1">
<title>Thrive Through Menopause</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8F1; --surface:#FFFDFA; --ink:#3B2A30; --muted:#6F5A63; --line:#EBDCD6;
  --fig:#A23A63; --fig-ink:#FFFFFF; --btn:#F6B9CD; --btn-ink:#3B1626;
  --sage:#EE93B2; --sage-soft:#FDE6EE; --sun:#F5883A; --sun-ink:#3A1A02;
  --tint:#FCE9EF; --danger:#B23A48; --logo-bg:transparent;
  --s0:#F5ECE4; --s1:#FBDCE6; --s2:#F7BFD1; --s3:#EE93B2; --s4:#BC4373; --s5:#8F2F55;
  --k3:#3B2A30; --k4:#FFFFFF; --k5:#FFFFFF;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#241A1D; --surface:#2F2226; --ink:#FBEFF2; --muted:#CDB6BE; --line:#48353C;
    --fig:#F4A6C0; --fig-ink:#3B1626; --btn:#F6B9CD; --btn-ink:#3B1626;
    --sage:#E9829F; --sage-soft:#3E2A31; --sun:#F7A25A; --sun-ink:#2A1400;
    --tint:#3A2830; --danger:#F08A98; --logo-bg:#FFF8F1;
    --s0:#38292F; --s1:#5A3444; --s2:#84455D; --s3:#D07A9C; --s4:#E38BAA; --s5:#F9C6D7;
    --k3:#2A1418; --k4:#2A1418; --k5:#2A1418;
  }
}
:root[data-theme="dark"]{
  --bg:#241A1D; --surface:#2F2226; --ink:#FBEFF2; --muted:#CDB6BE; --line:#48353C;
  --fig:#F4A6C0; --fig-ink:#3B1626; --btn:#F6B9CD; --btn-ink:#3B1626;
  --sage:#E9829F; --sage-soft:#3E2A31; --sun:#F7A25A; --sun-ink:#2A1400;
  --tint:#3A2830; --danger:#F08A98; --logo-bg:#FFF8F1;
  --s0:#38292F; --s1:#5A3444; --s2:#84455D; --s3:#D07A9C; --s4:#E38BAA; --s5:#F9C6D7;
  --k3:#2A1418; --k4:#2A1418; --k5:#2A1418;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html.big{font-size:118%}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.5;min-height:100%}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0;letter-spacing:-.01em}
h1{font-size:1.65rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding:1.1rem 1.1rem 7.5rem}
.muted{color:var(--muted)} .small{font-size:.875rem}
.stack>*+*{margin-top:1rem} .stack-lg>*+*{margin-top:1.6rem} .stack-sm>*+*{margin-top:.5rem}
.row{display:flex;align-items:center;gap:.75rem} .between{justify-content:space-between}
.grow{flex:1;min-width:0}
hr{border:0;border-top:1px solid var(--line);margin:0}
.hidden{display:none!important}

/* header */
.top h1{margin-bottom:.15rem}
.top .sub{color:var(--muted)}

/* brand */
.brand-row{display:flex;align-items:center;gap:.9rem}
.brand-row>div{min-width:0}
.logo-chip{flex:none;width:104px;background:var(--logo-bg);border-radius:14px;padding:.15rem .25rem;line-height:0}
.logo-chip img,.logo-lg img{width:100%;height:auto;display:block}
.logo-lg{width:min(64vw,250px);margin:0 auto;background:var(--logo-bg);border-radius:20px;padding:.5rem .7rem;line-height:0}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3rem;padding:.65rem 1.3rem;border-radius:999px;border:2px solid var(--fig);background:transparent;color:var(--fig);font-weight:700;text-decoration:none}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.block{display:flex;width:100%}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.btn.quiet{border-color:var(--line);color:var(--ink);font-weight:400}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.small{min-height:2.5rem;padding:.4rem 1rem;font-size:.9rem}
.linkbtn{background:none;border:0;padding:.4rem 0;color:var(--fig);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* ring */
.hero{display:grid;place-items:center;padding:.5rem 0 0}
.ring{width:min(72vw,270px);height:auto}
.ring text{font-family:var(--display)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:.5rem .9rem;margin-top:1rem;width:100%}
.legend div{display:flex;align-items:center;gap:.5rem;font-size:.9rem}
.legend i{width:.8rem;height:.8rem;border-radius:50%;background:var(--line);flex:none}
.legend i.on{background:var(--sun)} .legend i.part{background:var(--sage)}

/* sections */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.1rem}
.panel.tint{background:var(--tint);border-color:transparent}
.sect-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.6rem}
.list{list-style:none;margin:0;padding:0}
.list>li{padding:.85rem 0;border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.item-btn{display:flex;width:100%;align-items:center;justify-content:space-between;gap:.75rem;text-align:left;background:none;border:0;padding:0;min-height:2.75rem}
.chev{width:1.1rem;height:1.1rem;flex:none;color:var(--muted)}
.tag{display:inline-block;padding:.1rem .6rem;border-radius:999px;background:var(--sage-soft);color:var(--fig);font-size:.8rem;font-weight:700}
.tag.warn{background:var(--tint);color:var(--fig)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:.35rem .5rem calc(.35rem + env(safe-area-inset-bottom,0px))}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:.15rem}
.tab{display:flex;flex-direction:column;align-items:center;gap:.15rem;min-height:3.4rem;justify-content:center;background:none;border:0;border-radius:14px;color:var(--muted);font-size:.72rem;font-weight:700}
.tab svg{width:1.55rem;height:1.55rem}
.tab[aria-current="page"]{color:var(--fig);background:var(--tint)}
.tab.mid{color:var(--btn-ink);background:var(--btn)}
.tab.mid[aria-current="page"]{outline:3px solid var(--sun);outline-offset:-3px}

/* wizard / controls */
.steps{display:flex;gap:.35rem}
.steps i{height:.35rem;flex:1;border-radius:9px;background:var(--line)}
.steps i.done{background:var(--sage)} .steps i.now{background:var(--fig)}
.q{padding:1rem 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q label,.q .lab{display:block;font-weight:700;font-size:1.05rem}
.q .help{color:var(--muted);font-size:.875rem;margin:.1rem 0 .6rem}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem}
.chips.six{grid-template-columns:repeat(6,1fr)}
.chip{min-height:3.2rem;border-radius:14px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;padding:.2rem 0}
.chip small{font-size:.66rem;font-weight:400;color:var(--muted);line-height:1}
.chip[aria-pressed="true"]{border-color:var(--fig);background:var(--tint);color:var(--fig)}
.chip .em{font-size:1.45rem;line-height:1.1}
.ends{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);margin-top:.3rem}
.stepper{display:flex;align-items:center;gap:.6rem}
.stepper button{width:3.2rem;height:3.2rem;border-radius:50%;border:2px solid var(--fig);background:transparent;color:var(--fig);font-size:1.6rem;line-height:1;font-weight:700;flex:none}
.stepper input{width:100%;min-width:0;text-align:center;font-family:var(--display);font-size:1.7rem;font-weight:700;border:2px solid var(--line);border-radius:14px;min-height:3.2rem;background:var(--surface)}
.unit{color:var(--muted);font-size:.9rem;min-width:3.2rem}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.seg button{min-height:3.2rem;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--fig);background:var(--tint);color:var(--fig)}
.quick{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
.quick button{min-height:2.4rem;padding:0 .9rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.9rem}
.field{display:block}
.field>span{display:block;font-weight:700;margin-bottom:.25rem}
.inp,.field input:not([type=checkbox]),.field select,.field textarea,textarea.inp,select.inp{width:100%;min-height:3rem;border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:.55rem .8rem}
textarea{resize:vertical;min-height:6rem}

/* progress */
.metric{display:grid;grid-template-columns:1fr auto;gap:.1rem .8rem;padding:.8rem 0;border-top:1px solid var(--line)}
.metric:first-child{border-top:0}
.metric b{font-family:var(--display);font-size:1.35rem}
.trend{font-size:.85rem;color:var(--muted);grid-column:1/-1}
.dot{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;margin-right:.35rem;background:var(--line)}
.dot.good{background:var(--sage)} .dot.watch{background:var(--sun)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem}
.cal button{aspect-ratio:1;border-radius:10px;border:0;font-size:.8rem;font-weight:700;color:var(--ink);background:var(--s0)}
.cal button.c1{background:var(--s1)} .cal button.c2{background:var(--s2)} .cal button.c3{background:var(--s3);color:var(--k3)}
.cal button.c4{background:var(--s4);color:var(--k4)} .cal button.c5{background:var(--s5);color:var(--k5)}
.cal button.today{outline:3px solid var(--sun);outline-offset:1px}
.cal .dh{font-size:.72rem;text-align:center;color:var(--muted)}
.scale{display:flex;align-items:center;gap:.4rem;font-size:.75rem;color:var(--muted);margin-top:.5rem}
.scale i{width:1.2rem;height:.8rem;border-radius:3px;display:block}

/* sheet + toast */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(20,10,30,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:1.2rem 1.1rem calc(1.4rem + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:2.6rem;height:.3rem;background:var(--line);border-radius:9px;margin:-.4rem auto 1rem}
.toast{position:fixed;left:50%;bottom:calc(6rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7rem 1.2rem;border-radius:999px;z-index:60;font-weight:700;max-width:90vw}
.overlay{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.overlay .wrap{padding-bottom:3rem}
.big-num{font-family:var(--display);font-size:2.4rem;font-weight:700;line-height:1}
.pill-row{display:flex;gap:.4rem;flex-wrap:wrap}
.pill-row button{min-height:2.6rem;padding:0 1rem;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.pill-row button[aria-pressed="true"]{border-color:var(--fig);background:var(--tint);color:var(--fig)}
.check{display:flex;align-items:center;gap:.75rem;min-height:2.75rem}
.check input{width:1.6rem;height:1.6rem;accent-color:var(--fig);flex:none}
details.help-box{border:1px solid var(--line);border-radius:14px;padding:.6rem .9rem;background:var(--surface)}
details.help-box summary{cursor:pointer;font-weight:700;min-height:2rem;display:flex;align-items:center}
.day-card{border-top:1px solid var(--line);padding:1rem 0}
.day-card:first-child{border-top:0}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
}
@media print{
  .tabbar,.no-print,.toast{display:none!important}
  body{background:#fff;color:#000}
  .wrap{padding-bottom:1rem;max-width:none}
}
</style>

<body>
<div id="app"></div>
<div id="layer"></div>

<script>
(function(){
"use strict";

/* ---------- storage (private to this device/browser) ---------- */
const KEY = "thrive.planner.v1";
let mem = null;
const store = {
  get(){ try{ const t = localStorage.getItem(KEY); return t ? JSON.parse(t) : null; }catch(e){ return mem; } },
  set(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){ mem = o; } }
};

/* ---------- date helpers ---------- */
const pad = n => String(n).padStart(2,"0");
const ds = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = pd(s); d.setDate(d.getDate()+n); return ds(d); };
const diffDays = (a,b) => Math.round((pd(b)-pd(a))/86400000);
const today = () => ds(new Date());
const long = s => pd(s).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
const short = s => pd(s).toLocaleDateString(undefined,{day:"numeric",month:"short"});
const wkday = s => (pd(s).getDay()+6)%7; // Monday = 0
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const esc = t => String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => typeof v==="number" && !isNaN(v) ? v : 0;
const has = v => v!==undefined && v!==null && v!=="";

/* ---------- state ---------- */
const DEF = () => ({
  v:1, setup:false,
  settings:{name:"",programme:"Thrive Essentials",start:today(),theme:"auto",big:false,
    targets:{sleep:7.5,water:8,protein:90,move:30,strength:3}},
  entries:{}, planMove:{}, planMeals:{}, planDone:{}, shopping:[], goals:[], reviews:{}, supps:[], appts:[], draft:null,
  lastSave:null, savedCount:0
});
let S = Object.assign(DEF(), store.get()||{});
S.settings = Object.assign(DEF().settings, S.settings||{});
S.settings.targets = Object.assign(DEF().settings.targets, S.settings.targets||{});
const save = () => store.set(S);

let route = {tab:"today", sub:null};
let W = null;          // check-in wizard state
let range = 7;         // progress range
let planTab = "move";
let pending = null;   // an Excel file waiting to be confirmed

/* ---------- metrics ---------- */
const T = () => S.settings.targets;
function habitsMet(e){
  if(!e) return null;
  const t=T(); let n=0;
  if(num(e.sleep)>=t.sleep) n++;
  if(num(e.water)>=t.water) n++;
  if(num(e.protein)>=t.protein) n++;
  if(num(e.move)>=t.move) n++;
  if(e.supps==="Yes") n++;
  return n;
}
function symptomLoad(e){
  if(!e) return null;
  return num(e.fog)+num(e.joint)+num(e.anxiety)+Math.min(num(e.flushes),5);
}
function habitProgress(e){
  const t=T(); const g=(v,tg)=>tg>0?Math.min(1,num(v)/tg):0;
  if(!e) return [0,0,0,0,0];
  return [g(e.sleep,t.sleep),g(e.water,t.water),g(e.protein,t.protein),g(e.move,t.move),e.supps==="Yes"?1:0];
}
function streak(){
  let d = today(); if(!S.entries[d]) d = addDays(d,-1);
  let n=0; while(S.entries[d]){ n++; d = addDays(d,-1); }
  return n;
}
function weekNo(dateStr){ return Math.floor(diffDays(S.settings.start,dateStr)/7)+1; }
function avg(list){ const a=list.filter(v=>typeof v==="number"); return a.length? a.reduce((x,y)=>x+y,0)/a.length : null; }
const f1 = v => v==null ? "–" : (Math.round(v*10)/10).toString();
function datesBack(n, endStr){ const end = endStr||today(); const a=[]; for(let i=n-1;i>=0;i--) a.push(addDays(end,-i)); return a; }
function series(dates, fn){ return dates.map(d=>{ const e=S.entries[d]; return e? fn(e) : null; }); }
function greeting(){ const h=new Date().getHours(); return h<12?"Good morning":h<18?"Good afternoon":"Good evening"; }

/* ---------- gentle guidance ---------- */
const TIPS = [
  "Going to bed and getting up at similar times each day can help your body settle into a steadier sleep rhythm.",
  "Strength training two or three times a week helps you keep muscle and bone strength as hormones change.",
  "Try to include some protein at each meal. It helps keep you full and supports your muscles.",
  "A cooler bedroom and lighter layers on the bed help some women with night sweats.",
  "Use the notes box to jot down what happened before a hot flush. Over a few weeks you may spot your own triggers.",
  "Three slow breaths, in for four and out for six, can take the edge off a tense moment.",
  "A short walk outside, especially in the morning, is good for mood, energy and sleep.",
  "Sipping water through the day is easier than catching up in the evening.",
  "Small wins count. Meeting two habits today is a better day than meeting none.",
  "Bring your Progress summary to your next appointment. Specific numbers make the conversation easier.",
  "Screens and bright light late at night can make it harder to fall asleep. A wind-down routine helps.",
  "Gentle stretching or yoga counts as movement, especially on lower-energy days.",
  "If a symptom is new, severe or worrying, please speak with your GP or health practitioner."

/* ---------- small UI builders ---------- */
function stepper(f, min, max, step, unit, val, quick){
  return `<div class="stepper">
    <button type="button" data-a="step" data-f="${f}" data-d="-1" data-min="${min}" data-max="${max}" data-step="${step}" data-start="${quick&&quick.start||min}" aria-label="Less">−</button>
    <input type="number" inputmode="decimal" data-in="${f}" data-min="${min}" data-max="${max}" value="${has(val)?val:""}" placeholder="–" aria-label="${esc(f)}">
    <button type="button" data-a="step" data-f="${f}" data-d="1" data-min="${min}" data-max="${max}" data-step="${step}" data-start="${quick&&quick.start||min}" aria-label="More">+</button>
    <span class="unit">${unit||""}</span></div>`;
}
function chips(f, opts, val, cls){
  return `<div class="chips ${cls||""}" role="group">${opts.map(o=>
    `<button type="button" class="chip" data-a="pick" data-f="${f}" data-v="${o.v}" aria-pressed="${val===o.v}" aria-label="${esc(o.l||o.v)}">${o.em?`<span class="em">${o.em}</span>`:o.v}${o.s?`<small>${o.s}</small>`:""}</button>`).join("")}</div>`;
}
function yn(f,val){
  return `<div class="seg" role="group">${["Yes","No"].map(v=>`<button type="button" data-a="pick" data-f="${f}" data-v="${v}" aria-pressed="${val===v}">${v}</button>`).join("")}</div>`;
}
const FACES = [{v:1,em:"😩",l:"1, very low"},{v:2,em:"😕",l:"2, low"},{v:3,em:"😐",l:"3, okay"},{v:4,em:"🙂",l:"4, good"},{v:5,em:"😄",l:"5, great"}];
const SCALE05 = [0,1,2,3,4,5].map(v=>({v,l:String(v)}));
function toast(msg){
  const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg;

/* ---------- hero ring ---------- */
function arc(cx,cy,r,a0,a1){
  const p=a=>[cx+r*Math.cos(a*Math.PI/180), cy+r*Math.sin(a*Math.PI/180)];
  const [x0,y0]=p(a0),[x1,y1]=p(a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${(a1-a0)>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function ring(e){
  const prog=habitProgress(e), met=habitsMet(e);
  const cx=110,cy=110,r=88,span=72,gap=8;
  let paths="";
  for(let i=0;i<5;i++){
    const a0=-90+i*span+gap/2, a1=-90+(i+1)*span-gap/2;
    paths+=`<path d="${arc(cx,cy,r,a0,a1)}" fill="none" stroke="var(--line)" stroke-width="16" stroke-linecap="round"/>`;
    const p=prog[i];
    if(p>0.02){
      const end=a0+(a1-a0)*p;
      paths+=`<path d="${arc(cx,cy,r,a0,Math.max(end,a0+1))}" fill="none" stroke="${p>=1?"var(--sun)":"var(--sage)"}" stroke-width="16" stroke-linecap="round"/>`;
    }
  }
  const label = met==null ? "–" : met+"/5";
  return `<svg class="ring" viewBox="0 0 220 220" role="img" aria-label="${met==null?"No check-in yet today":met+" of 5 habits met"}">${paths}
    <text x="110" y="118" text-anchor="middle" font-size="46" font-weight="700" fill="var(--ink)">${label}</text>
    <text x="110" y="142" text-anchor="middle" font-size="14" fill="var(--muted)" style="font-family:var(--body)">habits met today</text></svg>`;
}

async function importFile(file){

    pending=data;
    const fresh=Object.keys(data.entries).filter(d=>!S.entries[d]).length;
    const bits=[]; if(data.goals&&data.goals.length) bits.push(data.goals.length+" goals"); if(data.supps&&data.supps.length) bits.push(data.supps.length+" supplements"); if(data.appts&&data.appts.length) bits.push(data.appts.length+" appointments");

  }catch(e){ toast("That file couldn't be read. Is it an Excel (.xlsx) file?"); }
}
function applyImport(mode){
  const p=pending; if(!p) return; pending=null;
  const lists=["goals","supps","appts","shopping"], objsK=["planMove","planMeals","reviews"];
  if(mode==="replace"){
    S.entries=Object.assign({},p.entries);
    if(p.settings){ const st=p.settings; S.settings=Object.assign({},S.settings,{name:st.name!=null?st.name:S.settings.name,programme:st.programme||S.settings.programme,start:st.start||S.settings.start,targets:Object.assign({},S.settings.targets,st.targets)}); }
    lists.forEach(k=>{ if(p[k]) S[k]=p[k]; }); objsK.forEach(k=>{ if(p[k]) S[k]=p[k]; });
  } else {

    if(p.settings&&p.settings.start&&Object.keys(S.entries).length===Object.keys(p.entries).length) S.settings.start=p.settings.start;
  }

}

/* ----- progress ----- */
function line(vals, dates, o){
  const w=320,h=o.h||140,pl=26,pr=8,pt=8,pb=20, min=o.min, max=o.max;
  const x=i=>pl+(w-pl-pr)*(dates.length<2?0.5:i/(dates.length-1));
  const y=v=>pt+(h-pt-pb)*(1-(v-min)/(max-min));
  let grid="";
  (o.ticks||[min,max]).forEach(tk=>{ grid+=`<line x1="${pl}" x2="${w-pr}" y1="${y(tk)}" y2="${y(tk)}" stroke="var(--line)"/><text x="${pl-5}" y="${y(tk)+3}" text-anchor="end">${tk}</text>`; });
  let out="";
  (o.series||[{vals,color:"var(--fig)"}]).forEach(s=>{
    let d="",pen=false;
    s.vals.forEach((v,i)=>{ if(v==null){pen=false;return;} d+=(pen?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)+" "; pen=true; });
    out+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.vals.forEach((v,i)=>{ if(v!=null) out+=`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${dates.length>20?1.8:3}" fill="${s.color}"/>`; });
  });
  const step=Math.max(1,Math.ceil(dates.length/6));
  let xl=""; dates.forEach((dt,i)=>{ if(i%step===0||i===dates.length-1) xl+=`<text x="${x(i)}" y="${h-5}" text-anchor="${i===0&&dates.length>1?"start":i===dates.length-1&&dates.length>1?"end":"middle"}">${esc(short(dt))}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.label)}">${grid}${out}${xl}</svg>`;
}
function bars(vals, dates, o){
  const w=320,h=o.h||130,pl=26,pr=8,pt=8,pb=20, max=o.max;
  const n=dates.length, bw=(w-pl-pr)/n, y=v=>pt+(h-pt-pb)*(1-v/max);
  let grid=`<line x1="${pl}" x2="${w-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/><text x="${pl-5}" y="${y(0)+3}" text-anchor="end">0</text><text x="${pl-5}" y="${y(max)+3}" text-anchor="end">${max}</text>`;
  let out="";
  vals.forEach((v,i)=>{ if(v!=null&&v>0){ const hh=Math.max(2,y(0)-y(Math.min(v,max))); out+=`<rect x="${(pl+i*bw+bw*0.15).toFixed(1)}" y="${(y(0)-hh).toFixed(1)}" width="${(bw*0.7).toFixed(1)}" height="${hh.toFixed(1)}" rx="3" fill="${o.color||"var(--sage)"}"/>`; }});
  let tl="";
  if(o.target!=null) tl=`<line x1="${pl}" x2="${w-pr}" y1="${y(o.target)}" y2="${y(o.target)}" stroke="var(--sun)" stroke-width="2" stroke-dasharray="5 4"/><text x="${w-pr}" y="${y(o.target)-4}" text-anchor="end">goal ${o.target}</text>`;
  const step=Math.max(1,Math.ceil(n/6));
  let xl=""; dates.forEach((dt,i)=>{ if(i%step===0||i===n-1) xl+=`<text x="${(pl+i*bw+bw/2).toFixed(1)}" y="${h-5}" text-anchor="${i===0?"start":i===n-1?"end":"middle"}">${esc(short(dt))}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.label)}">${grid}${tl}${out}${xl}</svg>`;
}
function trend(cur, prev, higherBetter){
  if(cur==null||prev==null) return `<span class="dot"></span>Not enough days yet to compare`;
  const d=cur-prev;
  if(Math.abs(d)<0.05) return `<span class="dot"></span>Steady compared with the days before`;
  const better = higherBetter ? d>0 : d<0;
  return `<span class="dot ${better?"good":"watch"}"></span>${better?"Improving":"Worth keeping an eye on"} (${d>0?"up":"down"} ${f1(Math.abs(d))} from the days before)`;
}

  for(let w=0;w<4;w++){ const end=addDays(today(),-7*w), ds_=datesBack(7,end); weeks.push({ds:ds_,end}); }
  weeks.forEach((wk,i)=>{
    const g=fn=>avg(series(wk.ds,fn)); const c=wk.ds.filter(d=>S.entries[d]).length;
    out+=`\n${i===0?"Last 7 days":short(wk.ds[0])+" to "+short(wk.ds[6])} (${c} days logged): sleep ${f1(g(e=>has(e.sleep)?e.sleep:null))} h, energy ${f1(g(e=>has(e.energy)?e.energy:null))}/5, mood ${f1(g(e=>has(e.mood)?e.mood:null))}/5, hot flushes ${f1(g(e=>has(e.flushes)?e.flushes:null))}/day, symptom load ${f1(g(e=>symptomLoad(e)))}/20, habits met ${f1(g(e=>habitsMet(e)))}/5`;
  });
  return out+"\n\nSelf-tracked with the Thrive Through Menopause planner. Not a medical record.";
}

function loadSample(){
  let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const ri=(a,b)=>Math.floor(a+rnd()*(b-a+1));
  const fresh=DEF(); fresh.setup=true;
  fresh.settings=Object.assign(fresh.settings,{name:S.settings.name||"Sam",programme:S.settings.programme,theme:S.settings.theme,big:S.settings.big,start:addDays(today(),-28),targets:S.settings.targets});
  for(let i=28;i>=1;i--){
    const d=addDays(today(),-i), p=(28-i)/28;
    fresh.entries[d]={ sleep:Math.round((5.6+p*1.8+rnd()*0.9)*2)/2, sq:Math.min(5,ri(2,3)+Math.round(p*1.6)), energy:Math.min(5,ri(2,3)+Math.round(p*1.5)), mood:Math.min(5,ri(2,4)+Math.round(p*1)),
      flushes:Math.max(0,ri(3,8)-Math.round(p*4)), sweats:rnd()>0.35+p*0.4?"Yes":"No", fog:Math.max(0,ri(1,4)-Math.round(p*2)), joint:Math.max(0,ri(1,3)-Math.round(p*1)), anxiety:Math.max(0,ri(1,4)-Math.round(p*2)),
      water:ri(4,9), protein:ri(55,105), move:ri(0,3)*15+15, strength:rnd()>0.6?"Yes":"No", supps:rnd()>0.2?"Yes":"No", notes:i%9===0?"Felt calmer after an evening walk.":undefined };
  }
  fresh.planMove={0:{focus:"Strength",min:40},1:{focus:"Walk",min:30},2:{focus:"Strength",min:40},3:{focus:"Mobility or yoga",min:30},4:{focus:"Strength",min:40},5:{focus:"Cardio",min:45},6:{focus:"Rest"}};
  S=fresh; save();
}

/* =====================================================================
   RENDER + EVENTS
   ===================================================================== */
function render(){
  const app=document.getElementById("app");
  document.documentElement.setAttribute("data-theme",S.settings.theme==="auto"?"":S.settings.theme);
  if(S.settings.theme==="auto") document.documentElement.removeAttribute("data-theme");
  document.documentElement.classList.toggle("big",!!S.settings.big);
  let html="";
  if(route.tab==="today") html=viewToday();
  else if(route.tab==="checkin") html=viewCheckin();
  else if(route.tab==="progress") html=viewProgress();
  else if(route.tab==="plan") html=viewPlan();
  else html=viewMore();
  const tabs=[["today","Today",IC.today],["progress","Progress",IC.prog],["checkin","Check-in",IC.check],["plan","Plan",IC.plan],["more","More",IC.more]];
  // order: Today, Progress, Check-in (middle), Plan, More
  const bar=`<div class="tabbar"><nav aria-label="Main">${tabs.map(([k,l,ic])=>`<button class="tab ${k==="checkin"?"mid":""}" data-a="go" data-tab="${k}" ${route.tab===k?'aria-current="page"':""}>${ic}<span>${l}</span></button>`).join("")}</nav></div>`;
  app.innerHTML=(S.setup?html+bar:"")+(S.setup?"":viewOnboarding());
}

function stepValue(btn){
  const f=btn.dataset.f, min=+btn.dataset.min, max=+btn.dataset.max, st=+btn.dataset.step, d=+btn.dataset.d, start=+btn.dataset.start;
  let cur=getField(f);
  let v = has(cur) ? +cur + d*st : (d>0 ? (start>min? start : min+ (min===0&&f!=="flushes"?st:0)) : min);
  if(!has(cur) && d>0) v = start>min ? start : min+st;
  v=Math.round(Math.min(max,Math.max(min,v))*100)/100;
  setField(f,v);
}
function getField(f){
  if(f.startsWith("t_")) return S.settings.targets[f.slice(2)];
  return W? W.data[f] : undefined;
}
function setField(f,v){
  if(f.startsWith("t_")){ S.settings.targets[f.slice(2)]=v; save(); }
  else if(W){ W.data[f]=v; draftSave(); }
}
function rerenderKeep(){ const y=window.scrollY; render(); window.scrollTo(0,y); }

document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-a]"); if(!b) return;
  const a=b.dataset.a;
  if(a==="closeSheetBg"){ if(ev.target===b) closeSheet(); return; }
  if(a==="toggleShop"||a==="doneToday"||a==="bigText") return; // handled on change
  switch(a){
    case "go": route={tab:b.dataset.tab,sub:null}; if(route.tab==="checkin"&&!W) openCheckinInit(); render(); window.scrollTo(0,0); break;
    case "openCheckin": closeSheet(); openCheckin(b.dataset.date); break;
    case "pickDay": sheet(`<h2>Which day?</h2><form data-form="pickDay" class="stack" style="margin-top:1rem"><label class="field"><span>Date</span><input type="date" name="date" value="${W.date}" max="${today()}"></label><div class="row"><button type="button" class="btn quiet" data-a="closeSheet">Cancel</button><span class="grow"></span><button class="btn primary" type="submit">Use this day</button></div></form>`); break;
    case "closeSheet": closeSheet(); break;
    case "step": stepValue(b); rerenderKeep(); break;
    case "pick": { const f=b.dataset.f; let v=b.dataset.v; if(["sq","energy","mood","fog","joint","anxiety","rev_overall"].includes(f)) v=+v;
      if(f==="rev_overall"){ const wk=weekNo(today()); S.reviews[wk]=Object.assign(S.reviews[wk]||{},{overall:v}); save(); }
      else { W.data[f]= W.data[f]===v ? undefined : v; draftSave(); }
      rerenderKeep(); break; }
    case "setVal": W.data[b.dataset.f]=+b.dataset.v; draftSave(); rerenderKeep(); break;
    case "wNext": W.step=Math.min(3,W.step+1); render(); window.scrollTo(0,0); break;
    case "wBack": W.step=Math.max(0,W.step-1); render(); window.scrollTo(0,0); break;
    case "wCancel": S.draft=null; save(); W=null; route={tab:"today",sub:null}; render(); break;
    case "wSave": finishSave(); break;
    case "range": range=+b.dataset.v; render(); break;
    case "openDay": dayDetail(b.dataset.date); break;
    case "copySummary": copyText(summaryText()); break;
    case "print": try{ window.print(); }catch(e){ toast("Printing isn't available here"); } break;
    case "planTab": planTab=b.dataset.v; render(); break;
    case "starterWeek": S.planMove={0:{focus:"Strength",min:40},1:{focus:"Walk",min:30},2:{focus:"Strength",min:40},3:{focus:"Mobility or yoga",min:30},4:{focus:"Strength",min:40},5:{focus:"Cardio",min:45},6:{focus:"Rest"}}; save(); render(); toast("Starter week added. Change anything you like."); break;
    case "editMove": editMove(+b.dataset.i); break;
    case "editMeals": editMeals(+b.dataset.i); break;
    case "clearShop": S.shopping=S.shopping.filter(x=>!x.done); save(); render(); break;
    case "sub": route={tab:"more",sub:b.dataset.v||null}; render(); window.scrollTo(0,0); break;
    case "theme": S.settings.theme=b.dataset.v; save(); rerenderKeep(); break;
    case "editGoal": editGoal(+b.dataset.i); break;
    case "delGoal": S.goals.splice(+b.dataset.i,1); save(); closeSheet(); render(); break;
    case "editSupp": editSupp(+b.dataset.i); break;
    case "delSupp": S.supps.splice(+b.dataset.i,1); save(); closeSheet(); render(); break;
    case "editAppt": editAppt(+b.dataset.i); break;
    case "delAppt": S.appts.splice(+b.dataset.i,1); save(); closeSheet(); render(); break;
    case "saveXlsx": exportXlsx(); break;
    case "pickFile": { const fi=document.getElementById("fileIn"); if(fi) fi.click(); break; }
    case "importAdd": applyImport("add"); break;
    case "importReplace": applyImport("replace"); break;
    case "backupCopy": copyText(JSON.stringify(S)); break;
    case "restore": { const t=document.getElementById("restoreBox").value.trim(); try{ const o=JSON.parse(t); if(!o||typeof o!=="object"||!o.entries) throw 0; S=Object.assign(DEF(),o); S.setup=true; save(); route={tab:"today",sub:null}; render(); toast("Backup restored"); }catch(e){ toast("That doesn't look like a backup. Check you copied all of it."); } break; }
    case "sample": sheet(`<h2>Load sample data?</h2><p class="muted" style="margin:.5rem 0 1rem">This replaces everything on this device with four weeks of made-up entries.</p><div class="stack-sm"><button class="btn primary block" data-a="sampleYes">Load sample data</button><button class="btn quiet block" data-a="closeSheet">Cancel</button></div>`); break;
    case "sampleYes": loadSample(); closeSheet(); route={tab:"today",sub:null}; render(); toast("Sample data loaded"); break;
    case "erase": sheet(`<h2>Erase everything?</h2><p class="muted" style="margin:.5rem 0 1rem">All check-ins, plans and settings on this device will be deleted. This can't be undone.</p><div class="stack-sm"><button class="btn danger block" data-a="eraseYes">Erase everything</button><button class="btn quiet block" data-a="closeSheet">Cancel</button></div>`); break;
    case "eraseYes": S=DEF(); store.set(S); W=null; ob=0; closeSheet(); route={tab:"today",sub:null}; render(); break;
    case "replayIntro": S.setup=false; ob=0; render(); break;
    case "obNext": ob=Math.min(2,ob+1); render(); window.scrollTo(0,0); break;
    case "obBack": ob=Math.max(0,ob-1); render(); break;
    case "obDone": S.setup=true; S.settings.start=today(); save(); route={tab:"today",sub:null}; render(); break;
    case "obSample": loadSample(); route={tab:"today",sub:null}; render(); toast("Sample data loaded. Erase it any time in More."); break;
  }
});

document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="fileIn"){ const f=t.files&&t.files[0]; t.value=""; importFile(f); return; }
  if(t.matches("[data-in]")){
    const f=t.dataset.in, min=+t.dataset.min, max=+t.dataset.max;
    if(t.value===""){ if(f.startsWith("t_")) return; W.data[f]=undefined; draftSave(); return; }
    let v=parseFloat(t.value); if(isNaN(v)) return; v=Math.min(max,Math.max(min,v)); setField(f,v); rerenderKeep(); return;
  }
  if(t.matches("[data-set]")){ S.settings[t.dataset.set]=t.value; save(); return; }
  if(t.matches("[data-rev]")){ const wk=weekNo(today()); S.reviews[wk]=Object.assign(S.reviews[wk]||{},{[t.dataset.rev]:t.value}); save(); toast("Saved"); return; }
  if(t.dataset.a==="toggleShop"){ S.shopping[+t.dataset.i].done=t.checked; save(); rerenderKeep(); return; }
  if(t.dataset.a==="doneToday"){ if(t.checked) S.planDone[today()]=true; else delete S.planDone[today()]; save(); return; }
  if(t.dataset.a==="bigText"){ S.settings.big=t.checked; save(); rerenderKeep(); return; }
});
document.addEventListener("input",ev=>{ const t=ev.target; if(t.matches("[data-note]")&&W){ W.data.notes=t.value; draftSave(); } });

document.addEventListener("submit",ev=>{
  const f=ev.target.closest("form[data-form]"); if(!f) return; ev.preventDefault();
  const fd=Object.fromEntries(new FormData(f).entries()); const i=+f.dataset.i; const k=f.dataset.form;
  if(k==="pickDay"){ if(fd.date){ const dd=fd.date>today()?today():fd.date; closeSheet(); S.draft=null; openCheckin(dd); } return; }
  if(k==="addShop"){ const t=(fd.item||"").trim(); if(t){ S.shopping.push({t,done:false}); save(); render(); } return; }
  if(k==="saveMove"){ if(fd.focus) S.planMove[i]={focus:fd.focus,min:fd.min?+fd.min:0,note:fd.note||""}; else delete S.planMove[i]; }
  if(k==="saveMeals"){ S.planMeals[i]={b:fd.b,l:fd.l,d:fd.d,s:fd.s}; }
  if(k==="saveGoal"){ if(!(fd.t||"").trim()) return; if(i>=0) S.goals[i]=fd; else S.goals.push(fd); }
  if(k==="saveSupp"){ if(!(fd.name||"").trim()) return; if(i>=0) S.supps[i]=fd; else S.supps.push(fd); }
  if(k==="saveAppt"){ if(i>=0) S.appts[i]=fd; else S.appts.push(fd); }
  save(); closeSheet(); render(); toast("Saved");
});
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape") closeSheet(); });

render();
})();
</script>
